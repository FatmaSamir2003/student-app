<div class="container mt-4">
  <div class="card shadow border-0">
    <div
      class="card-header bg-dark text-white d-flex justify-content-between align-items-center p-3"
    >
      <h4 class="mb-0">Students Management</h4>
    </div>
    <div class="card-body">
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <input
            type="text"
            class="form-control"
            placeholder="Search by name..."
            [(ngModel)]="searchTerm"
          />
        </div>
        <div class="col-md-6">
          <select class="form-select" [(ngModel)]="selectedDept">
            <option value="">All Departments</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Information Systems">Information Systems</option>
            <option value="Engineering">Engineering</option>
          </select>
        </div>
      </div>
      <app-student-table
        [studentsData]="filteredStudents"
        (deleteEvent)="deleteStudent($event)"
      ></app-student-table>
    </div>
  </div>
</div>
