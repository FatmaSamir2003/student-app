<div class="container mt-5">
  <div class="card shadow mx-auto" style="max-width: 600px; border-radius: 15px">
    <div
      [class]="isEditMode ? 'card-header bg-warning p-4' : 'card-header bg-dark text-white p-4'"
      style="border-radius: 15px 15px 0 0"
    >
      <h3 class="mb-0 fw-bold">{{ isEditMode ? 'Edit Student' : ' Add Student' }}</h3>
    </div>
    <div class="card-body p-4">
      <form #f="ngForm" (ngSubmit)="save()">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-bold">First Name</label>
            <input
              type="text"
              name="firstName"
              [(ngModel)]="student.firstName"
              class="form-control"
              required
            />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Last Name</label>
            <input
              type="text"
              name="lastName"
              [(ngModel)]="student.lastName"
              class="form-control"
              required
            />
          </div>
          <div class="col-md-12">
            <label class="form-label fw-bold">Email</label>
            <input
              type="email"
              name="email"
              [(ngModel)]="student.email"
              class="form-control"
              required
            />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Age</label>
            <input type="number" name="age" [(ngModel)]="student.age" class="form-control" />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">GPA</label>
            <input
              type="number"
              step="0.1"
              name="GPA"
              [(ngModel)]="student.GPA"
              class="form-control"
            />
          </div>
          <div class="col-md-12">
            <label class="form-label fw-bold">Department</label>
            <select name="department" [(ngModel)]="student.department" class="form-select" required>
              <option value="">Select...</option>
              <option value="Computer Science">Computer Science</option>
              <option value="Information Systems">Information Systems</option>
              <option value="Engineering">Engineering</option>
            </select>
          </div>
        </div>
        <div class="d-flex justify-content-between mt-4">
          <button type="button" class="btn btn-light border" routerLink="/students">Cancel</button>
          <button
            type="submit"
            class="btn px-5 fw-bold"
            [class]="isEditMode ? 'btn-warning' : 'btn-dark'"
            [disabled]="!f.valid"
          >
            {{ isEditMode ? 'Update' : 'Save' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
