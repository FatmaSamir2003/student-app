<div class="container mt-5">
  <div class="card shadow-lg border-0" style="max-width: 700px; margin: auto; border-radius: 15px">
    <div
      [class]="
        isEditMode
          ? 'card-header bg-warning text-dark p-4'
          : 'card-header bg-primary text-white p-4'
      "
      style="border-radius: 15px 15px 0 0"
    >
      <h3 class="mb-0 fw-bold">
        {{ isEditMode ? ' Edit Student Information' : ' Add New Student' }}
      </h3>
      <p class="mb-0 opacity-75">Please fill in the details below</p>
    </div>

    <div class="card-body p-4">
      <form #f="ngForm" (ngSubmit)="save()">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-bold">First Name</label>
            <input
              type="text"
              name="firstName"
              [(ngModel)]="student.firstName"
              class="form-control"
              placeholder="e.g. Ali"
              required
            />
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">Last Name</label>
            <input
              type="text"
              name="lastName"
              [(ngModel)]="student.lastName"
              class="form-control"
              placeholder="e.g. Hassan"
              required
            />
          </div>

          <div class="col-md-12">
            <label class="form-label fw-bold">Email Address</label>
            <input
              type="email"
              name="email"
              [(ngModel)]="student.email"
              class="form-control"
              placeholder="name@example.com"
              required
            />
          </div>

          <div class="col-md-4">
            <label class="form-label fw-bold">Age</label>
            <input
              type="number"
              name="age"
              [(ngModel)]="student.age"
              class="form-control"
              placeholder="20"
            />
          </div>

          <div class="col-md-4">
            <label class="form-label fw-bold">GPA</label>
            <input
              type="number"
              step="0.1"
              name="GPA"
              [(ngModel)]="student.GPA"
              class="form-control"
              placeholder="0.0 - 4.0"
            />
          </div>

          <div class="col-md-4">
            <label class="form-label fw-bold">Department</label>
            <select name="department" [(ngModel)]="student.department" class="form-select" required>
              <option value="">Select...</option>
              <option value="Computer Science">Computer Science</option>
              <option value="Information Systems">Information Systems</option>
              <option value="Engineering">Engineering</option>
            </select>
          </div>
        </div>

        <div class="d-flex justify-content-end mt-4 gap-2">
          <button type="button" class="btn btn-light px-4 border" routerLink="/students">
            Cancel
          </button>
          <button
            type="submit"
            class="btn px-5 fw-bold shadow-sm"
            [class]="isEditMode ? 'btn-warning' : 'btn-primary'"
            [disabled]="!f.valid"
          >
            {{ isEditMode ? 'Update Data' : 'Save Student' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
